name = "arcade-realm-api"
main = "src/index.js"
compatibility_date = "2026-11-10"

[[durable_objects.bindings]]
name = "REALM_ROOMS"
class_name = "RealmRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealmRoom"]

[vars]
ALLOWED_ORIGINS = "https://tanushgargjanuary-bot.github.io,http://127.0.0.1:4173"

[[ratelimits]]
name = "ROOM_CONNECT_LIMIT"
namespace_id = "20261110" # Use a unique namespace ID in your Cloudflare account.

[ratelimits.simple]
limit = 30
period = 60
